
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Berita - SMP Negeri 4 Tanggul</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
</head>
<body>

  <main class="detail-berita-container">

    <a href="index.html#berita" class="detail-berita-kembali">
      ← Kembali ke Berita
    </a>

    <article id="detail-berita">
      <p>Memuat berita...</p>
    </article>

  </main>

  <script type="module">
    import { supabase } from './supabase.js';

    async function muatDetailBerita() {
      const wadah = document.getElementById('detail-berita');

      const parameter = new URLSearchParams(window.location.search);
      const slug = parameter.get('slug');

      if (!slug) {
        wadah.textContent = 'Berita tidak ditemukan.';
        return;
      }

      const { data, error } = await supabase
        .from('berita')
        .select('judul, ringkasan, isi_berita, gambar, published_at')
        .eq('slug', slug)
        .eq('status', 'published')
        .maybeSingle();

      if (error) {
        console.error('Gagal memuat detail berita:', error.message);
        wadah.textContent = 'Berita belum dapat dimuat.';
        return;
      }

      if (!data) {
        wadah.textContent = 'Berita tidak ditemukan atau belum diterbitkan.';
        return;
      }

      const judul = document.createElement('h1');
      judul.textContent = data.judul;

      const tanggal = document.createElement('p');
      tanggal.className = 'detail-berita-tanggal';
      tanggal.textContent = data.published_at
        ? new Date(data.published_at).toLocaleDateString('id-ID', {
            day: 'numeric',
            month: 'long',
            year: 'numeric'
          })
        : '';

      wadah.replaceChildren();

      wadah.appendChild(judul);
      wadah.appendChild(tanggal);

      if (data.gambar) {
        const gambar = document.createElement('img');
        gambar.src = data.gambar;
        gambar.alt = data.judul;
        gambar.className = 'detail-berita-gambar';
        wadah.appendChild(gambar);
      }

      if (data.ringkasan) {
        const ringkasan = document.createElement('p');
        ringkasan.className = 'detail-berita-ringkasan';
        ringkasan.textContent = data.ringkasan;
        wadah.appendChild(ringkasan);
      }

      const isi = document.createElement('div');
        isi.className = 'detail-berita-isi';

        isi.innerHTML = DOMPurify.sanitize(data.isi_berita || '', {
        USE_PROFILES: { html: true }
        });

        wadah.appendChild(isi);
    }

    muatDetailBerita();
  </script>

</body>
</html>
