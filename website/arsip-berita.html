<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arsip Berita - SMP Negeri 4 Tanggul</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="arsip-berita-container">
    <a href="index.html#berita" class="detail-berita-kembali">
      ← Kembali ke Beranda
    </a>

    <header class="arsip-berita-header">
      <h1>Berita Sekolah</h1>
      <p>Informasi dan kegiatan terbaru SMP Negeri 4 Tanggul.</p>
    </header>

    <div id="arsip-berita-list" class="berita-list">
      <p>Memuat berita...</p>
    </div>
  </main>

  <script type="module">
    import { supabase } from './supabase.js';

    async function muatArsipBerita() {
      const daftarBerita = document.getElementById('arsip-berita-list');

      const { data, error } = await supabase
        .from('berita')
        .select('judul, slug, ringkasan, gambar, published_at')
        .eq('status', 'published')
        .order('published_at', { ascending: false });

      if (error) {
        console.error('Gagal memuat arsip berita:', error.message);
        daftarBerita.textContent = 'Berita belum dapat dimuat.';
        return;
      }

      if (!data || data.length === 0) {
        daftarBerita.textContent = 'Belum ada berita yang diterbitkan.';
        return;
      }

      daftarBerita.innerHTML = data.map(berita => `
        <a
          href="detail-berita.html?slug=${encodeURIComponent(berita.slug)}"
          class="berita-card berita-link"
        >
          <div class="berita-gambar">
            <img
              src="${berita.gambar || 'https://placehold.co/600x400/037FC5/FFFFFF?text=Berita+Sekolah'}"
              alt="${berita.judul}"
            >
          </div>
          <div class="berita-content">
            <span class="berita-kategori">BERITA SEKOLAH</span>
            <h3>${berita.judul}</h3>
            <p>${berita.ringkasan || ''}</p>
          </div>
        </a>
      `).join('');
    }

    muatArsipBerita();
  </script>

</body>
</html>
